<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24-challenge-layout</title>
    <style>
        main {
            background-color: #17a053;
            border: 4px solid #fff;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2rem;
            margin: 0;
        }
        div.logo {
            background: url(/src/imgs/spriteweb.png) no-repeat;
            background-position: -20px -434px;
            height: 120px;
            margin-bottom: 2rem;
            width: 180px;
        }
        .menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        div.box {
            display: flex;
            background-color: #14522d;
            color: azure;
            justify-content: center;
            align-items: center;
            margin: 10px;
            padding: 15px 30px;
            font-family: sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 5px solid #fff;
            cursor: pointer;
        }
        div.box:hover{
            border-bottom-color: #ffff00;
        }
        section {
    background-color: #14522d;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    width: 750px;
    padding: 25px;
    margin: 20px auto;
}
    </style>
</head>
<body>
    <main>
        <div class="logo"></div>
        <div class="menu">
            <div class="box">Inicio</div>
            <div class="box">Nosotros</div>
            <div class="box">Portafolio</div>
            <div class="box">Servicios</div>
            <div class="box">Contacto</div>
        </div>
        <section>
            <div class="img_1">Sprite01</div>
            <div class="img_2">Sprite02</div>
            <div class="img_3">Sprite03</div>
        </section>
    </main>
</body>
</html>
