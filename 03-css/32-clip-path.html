<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        div.path{
            background: url(/src/imgs/belle.jpg) no-repeat center;
            background-size: contain;
            width: 400px;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            clip-path: circle(40%);
        }
        div.path_2{
            background: url(/src/imgs/belle.jpg) no-repeat center;
            background-size: contain;
            width: 400px;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            clip-path: ellipse(50% 40%);
        }
        div.path_3{
            background: url(/src/imgs/belle.jpg) no-repeat center;
            background-size: contain;
            width: 400px;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    <main>
        <header>
        <h1 id="h1_1">32 Clip path</h1>
        <h2>Property lets you clip an element to a basic shape.</h2>
        </header>
        <section>
        <h3>Circle</h3>
        <div class="path"></div>
        <h3>Ellipse</h3>
        <div class="path_2"></div>
        <h3>Star</h3>
        <div class="path_3"></div>
        </section>
    </main>
</body>
</html>
