<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Musume Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 2rem;
        }
        main {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        header.logo {
            max-width: 350px;
            width: 100%;
            height: auto;
        }
        .umas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 4rem;
        }
        
        .kitasan {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding-bottom: 1rem; 
            cursor: pointer; 
        }
        .kitasan img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .kitasan h3 {
            margin: 1rem 0 0 0;
            font-size: 1.2rem;
            color: #333;
        }
        .kitasan:hover h3 {
            color: #ff577f;
            text-shadow: 0 0 8px rgba(255, 87, 127, 0.3); 
        }

        .satono {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding-bottom: 1rem; 
            cursor: pointer; 
        }
        .satono img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .satono h3 {
            margin: 1rem 0 0 0;
            font-size: 1.2rem;
            color: #333;
        }
        .satono:hover h3 {
            color: #ff577f;
            text-shadow: 0 0 8px rgba(255, 87, 127, 0.3); 
        }

        .tokai {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding-bottom: 1rem; 
            cursor: pointer; 
        }
        .tokai img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .tokai h3 {
            margin: 1rem 0 0 0;
            font-size: 1.2rem;
            color: #333;
        }
        .tokai:hover h3 {
            color: #ff577f;
            text-shadow: 0 0 8px rgba(255, 87, 127, 0.3); 
        }

        .mejiro {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding-bottom: 1rem; 
            cursor: pointer; 
        }
        .mejiro img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .mejiro h3 {
            margin: 1rem 0 0 0;
            font-size: 1.2rem;
            color: #333;
        }
        .mejiro:hover h3 {
            color: #ff577f;
            text-shadow: 0 0 8px rgba(255, 87, 127, 0.3); 
        }

        .informacion {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .uma-perfil {
            display: flex;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .uma-perfil img {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }
        .uma-info {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .uma-info h2 {
            margin-top: 0;
            color: #ff577f;
        }
        .uma-info p {
            line-height: 1.6;
            margin-bottom: 0;
        }
        @media (max-width: 1024px) {
            body {
                padding: 1.5rem;
            }
            .umas {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .umas {
                grid-template-columns: 1fr;
            }
            .uma-perfil {
                flex-direction: column;
            }
            .uma-perfil img {
                width: 100%;
                height: 250px;
            }
            .uma-info {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <img src="/src/imgs/uma_logo.jpg" class="logo">
        </header>
        <section class="umas">
            <div class="kitasan">
                <img src="/src/imgs/kitasan.jpg" alt="Kitasan Black">
                <h3>Kitasan Black</h3>
            </div>
            <div class="satono">
                <img src="/src/imgs/satono.jpg" alt="Satono Diamond">
                <h3>Satono Diamond</h3>
            </div>
            <div class="tokai">
                <img src="/src/imgs/tokai.jpg" alt="Tokai Teio">
                <h3>Tokai Teio</h3>
            </div>
            <div class="mejiro">
                <img src="/src/imgs/mejiro.jpg" alt="Mejiro McQueen">
                <h3>Mejiro McQueen</h3>
            </div>
        </section>
        <section class="informacion">
            <div class="uma-perfil">
                <img src="/src/imgs/tokai_2.jpg" alt="Tokai Teio">
                <div class="uma-info">
                    <h2>Tokai Teio</h2>
                    <p>"Emperador"</p>
                </div>
            </div>
            <div class="uma-perfil">
                <img src="/src/imgs/mejiro_2.jpg" alt="Mejiro McQueen">
                <div class="uma-info">
                    <h2>Mejiro McQueen</h2>
                    <p>De la familia Mejiro</p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
