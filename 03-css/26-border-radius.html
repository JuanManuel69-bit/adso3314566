<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-border-radius</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        div.bor {
            background-color: #fff9;
            height: 140px;
            margin-block: 1rem;
            margin-inline: auto;
            width: 140px;
            border-radius: 50%;
        }

        div.bor_2 {
            background-color: #fff9;
            height: 140px;
            margin-block: 1rem;
            margin-inline: auto;
            width: 140px;
            border-radius: 40px 0;
        }

        div.bor_3 {
            background-color: #fff9;
            height: 140px;
            margin-block: 1rem;
            margin-inline: auto;
            width: 140px;
            border-radius: 140px 0 0 140px;
        }

        div.bor_4 {
            background-color: #fff9;
            height: 140px;
            margin-block: 1rem;
            margin-inline: auto;
            width: 140px;
            border-radius: 140px 0 140px 140px;
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">26 Border Radius</h1>
            <h2>Property defines the radius of the element's corners.</h2>
        </header>
        <section>
            <h2>Border-radius 50%</h2>
            <div class="bor"></div>
        </section>
        <section>
            <h2>Border-radius 40px 0</h2>
            <div class="bor_2"></div>
        </section>
        <section>
            <h2>Border-radius 140px 0 0 140px</h2>
            <div class="bor_3"></div>
        </section>
        <section>
            <h2>Border-radius 140px 0 140px 140px</h2>
            <div class="bor_4"></div>
        </section>
    </main>
</body>

</html>
