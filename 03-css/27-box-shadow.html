<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box-shadow</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        div.box{
            background-color: #0006;
            height: 140px;
            margin: 2rem auto;
            width: 200px;
        }
        div.box1 {box-shadow: 0 0 12px #fff;}
        div.box2 {box-shadow: -10px -10px 24px 0 #fff;}
        div.box3 {box-shadow: 0 0 20px #fff inset;}
        div.box4 {
            box-shadow: 4px 4px 0 4px #cc0,
                        8px 8px 0 6px #00c,
                        12px 12px 0 8px #c00;
        }
        div.images{
            display: flex;
            justify-content: center;
            margin-block: 2rem;
            gap: 1rem;
        }
        div.images img:first-child {
            box-shadow: 0 0 12px #fff;
        }
        div.images img:last-child {
            filter: drop-shadow(0 0 12px #fff);
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">27 Box Shadow</h1>
            <h2>Property attaches one or more shadows to an element.</h2>
        </header>
        <section>
            <h3>box-shadow: 0 0 12px #fff</h3>
            <div class="box box1"></div>
            <h3>box-shadow: -10px -10px 24px 0 #fff</h3>
            <div class="box box2"></div>
            <h3>box-shadow: 0 0 20px #fff inset</h3>
            <div class="box box3"></div>
            <h3>box-shadow: multiple</h3>
            <div class="box box4"></div>
            <h3>box-shadow: images</h3>
            <div class="images">
                <img src="/src/imgs/narita.png" width="180px">
                <img src="/src/imgs/narita.png" width="180px">
            </div>
        </section>
    </main>
</body>
</html>
