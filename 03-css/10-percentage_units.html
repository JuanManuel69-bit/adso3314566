<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-percentage_units</title>
    <link rel="stylesheet" href="../03-css/css/10-percentage_units.css">
    <style>
        main {
            width: 100%;

            section.percentage {
                margin: 0 auto;
                width: 80%;

                div.parent {
                    display: flex;
                    justify-content: center;
                    align-items: center;

                    div {
                        display: flex;
                        justify-content: center;
                        font-size: 2rem;
                        align-items: center;
                        height: 50dvh;
                        &.child1{
                            background-color: rebeccapurple;
                            width: 70%;
                        }
                        &.child2{
                            background-color: cadetblue;
                            width: 30%;
                        }
                    }
                }
            }
        }
    </style>
</head>

<body>
    <a href="../03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="header_01">
            <h1 id="h1_1">10-Percentage units</h1>
            <h2>Are relative to the size of the parent element.</h2>
        </header>
        <section class="percentage">
            <div class="parent">
                <div class="child1">70%</div>
                <div class="child2">30%</div>
            </div>
        </section>
    </main>
</body>

</html>
