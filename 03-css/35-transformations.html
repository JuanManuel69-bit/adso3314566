<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-transformations</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        div.belle {
            background: url(/src/imgs/belle.jpg) no-repeat center;
            background-size: contain;
            width: 400px;
            height: 300px;
            margin-left: auto;
            margin-right: auto;
            transition: transform 0.3s ease;
        }
        .rotar:hover {
            transform: rotate(15deg);
        }
        .escalar:hover {
            transform: scale(1.1);
        }
        .mover:hover {
            transform: translate(20px, -10px);
        }
        .inclinar:hover {
            transform: skewX(-15deg);
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">35 Transformations</h1>
            <h2>Property lets you rotate, scale, skew, or translate an element.</h2>
        </header>
        <section>
            <h3>Rotate</h3>
            <div class="belle rotar"></div>
            <h3>Scale</h3>
            <div class="belle escalar"></div>
            <h3>Translate</h3>
            <div class="belle mover"></div>
            <h3>Skew</h3>
            <div class="belle inclinar"></div>
        </section>
    </main>
</body>

</html>
