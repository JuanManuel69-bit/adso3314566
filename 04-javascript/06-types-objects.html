<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06-types-objects</title>
    <link rel="stylesheet" href="/04-javascript/css/js.css">
</head>

<body>
    <a href="/04-javascript/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">06 Types Objects</h1>
            <h2>Understand and work with different object types.</h2>
        </header>
        <section>
            <ul class="objects"></ul>
        </section>
    </main>
    <script>
        // Elements
        const objs = document.querySelector('.objects');

        // Object String
        const string = new String('Javascript 💛');
        objs.innerHTML = `<li>${string} -> ${string.constructor.name}</li>`;

        // Object Number
        const number = new Number(256);
        objs.innerHTML += `<li> ${number} -> Object: ${number.constructor.name} </li>`;

        // Object Boolean
        const bool = new Boolean(512>126);
        objs.innerHTML += `<li> ${bool} -> Object: ${bool.constructor.name} </li>`;

        // Object Array
        const arr = new Array('🛻','🚗','🚕','🚑','🏍️');
        objs.innerHTML += `<li> ${arr} -> Object: ${arr.constructor.name} </li>`;

        // Object Date
        const dt = new Date('12/12/2026');
        objs.innerHTML += `<li> ${dt} -> Object: ${dt.constructor.name} </li>`;

        // Object  
        const obj = new Object('Vehicle');
        objs.innerHTML += `<li> ${obj} -> Object: ${obj.constructor.name} </li>`;
    </script>
</body>

</html>
