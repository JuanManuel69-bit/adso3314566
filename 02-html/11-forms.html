<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-forms</title>
    <link rel="stylesheet" href="../src/css/02-html.css">
</head>

<body>
    <a href="../02-html/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1>11-Forms</h1>
            <h2>Creates interactive forms for user input.</h2>
        </header>
        <section>
            <form action="procesar_datos" method="post" class="custom-form">

                <div class="form-group">
                    <label for="usuario">Nombre de Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Tu apodo">
                </div>

                <div class="form-group">
                    <label for="pass">Contraseña:</label>
                    <input type="password" id="pass" name="password" placeholder="Mínimo 8 caracteres">
                </div>

                <div class="form-group">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+57 ...">
                </div>

                <div class="form-group">
                    <label for="web">Sitio Personal:</label>
                    <input type="url" id="web" name="web" placeholder="https://tu-sitio.com">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>

                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" name="hora">
                </div>

                <div class="form-group">
                    <label for="mes">Mes:</label>
                    <input type="month" id="mes" name="mes">
                </div>

                <div class="form-group">
                    <label for="semana">Semana:</label>
                    <input type="week" id="semana" name="semana">
                </div>

                <div class="form-group">
                    <label for="cita">Cita completa:</label>
                    <input type="datetime-local" id="cita" name="cita">
                </div>

                <div class="form-group">
                    <label>Género:</label>
                    <div class="options-row">
                        <input type="radio" id="m" name="gen" value="m"> <label for="m">Masculino</label>
                        <input type="radio" id="f" name="gen" value="f"> <label for="f">Femenino</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Suscripciones:</label>
                    <div class="options-row">
                        <input type="checkbox" id="news" name="sub" value="1"> <label for="news">Noticias</label>
                        <input type="checkbox" id="prom" name="sub" value="2"> <label for="prom">Promociones</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tono">Color preferido:</label>
                    <input type="color" id="tono" name="tono" value="#ff430b">
                </div>

                <div class="form-group">
                    <label for="nivel">Volumen:</label>
                    <input type="range" id="nivel" name="nivel" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" max="10">
                </div>

                <div class="form-group">
                    <label for="busqueda">Búsqueda:</label>
                    <input type="search" id="busqueda" name="busqueda" placeholder="Buscar contenido...">
                </div>

                <input type="hidden" name="token_seguridad" value="12345ABCDE">

                <div class="button-grid">
                    <input type="button" value="Click (button)" onclick="alert('Hola')">

                    <label>Enviar vía Imagen:</label>
                    <input type="image" src="https://via.placeholder.com/50x20/ff430b/ffffff?text=ENVIAR" alt="Submit">

                    <input type="reset" value="Limpiar (reset)" class="btn-reset">
                    <input type="submit" value="Enviar Datos (submit)" class="btn-submit">
                </div>

            </form>
        </section>
    </main>
</body>

</html>
