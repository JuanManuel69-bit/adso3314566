<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-challenge-tables</title>
    <link rel="stylesheet" href="../src/css/02-html.css">
</head>

<body>
    <a href="../02-html/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1>10-Challenge Tables</h1>
            <h2>Challenge</h2>
        </header>
        <section>
            <style>
                table {
                    border-collapse: collapse;
                    background-color: #333;
                    /* Gris oscuro de fondo */
                    margin: 20px auto;
                }

                td {
                    width: 50px;
                    height: 50px;
                    border: 1px solid white;
                    /* Bordes blancos como la imagen */
                    text-align: center;
                    vertical-align: middle;
                    font-size: 24px;
                    padding: 0;
                }

            </style>

            <table>
                <tr>
                    <td colspan="5"></td>
                    <td bgcolor="black">😎</td>
                    <td colspan="3"></td>
                </tr>
                <tr>
                    <td colspan="4"></td>
                    <td bgcolor="black">😎</td>
                    <td rowspan="2" bgcolor="black">😎</td>
                    <td bgcolor="black">😎</td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td colspan="3"></td>
                    <td bgcolor="black">😎</td>
                    <td></td>
                    <td bgcolor="black">😎</td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td colspan="2"></td>
                    <td bgcolor="black">😎</td>
                    <td bgcolor="black" colspan="3">😎</td>
                    <td bgcolor="black">😎</td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td></td>
                    <td bgcolor="black">😎</td>
                    <td bgcolor="black" colspan="5">😎</td>
                    <td bgcolor="black">😎</td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="2"></td>
                    <td bgcolor="black">😎</td>
                    <td bgcolor="black" colspan="3">😎</td>
                    <td bgcolor="black">😎</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3"></td>
                    <td bgcolor="black">😎</td>
                    <td></td>
                    <td bgcolor="black">😎</td>
                    <td colspan="3"></td>
                </tr>
                <tr>
                    <td colspan="4"></td>
                    <td bgcolor="black">😎</td>
                    <td bgcolor="black">😎</td>
                    <td bgcolor="black">😎</td>
                    <td colspan="2"></td>
                </tr>
                <tr>
                    <td colspan="5"></td>
                    <td bgcolor="black">😎</td>
                    <td colspan="3"></td>
                </tr>
            </table>
        </section>
    </main>
</body>

</html>
