<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21-list</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        .lista {
            list-style-type: decimal-leading-zero;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_2 {
            list-style-type: none;
            padding: 0;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
            list-style-type: decimal-leading-zero;
            list-style-position: inside;
            border: 5px solid black;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_2 li {
            background-image: url(/src/imgs/ilove.jpg);
            background-repeat: no-repeat;
            background-size: 15px 15px;
            background-position: left center;
            padding-left: 25px;
        }

        .lista_3 {
            list-style-type: lower-alpha;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_4 {
            list-style-type: square;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_5 {
            list-style-type: armenian;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_6 {
            list-style-type: lower-greek;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }

        .lista_7 {
            list-style-type: upper-roman;
            list-style-position: inside;
            border: 5px solid black;
            width: 159px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
