<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-cursors</title>
    <link rel="stylesheet" href="/src/css/03-css.css">
    <style>
        .caja-cursor {
            border: 5px solid black;
            width: 159px;
            height: 100px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auto {
            cursor: auto;
        }

        .pointer {
            cursor: pointer;
        }

        .crosshair {
            cursor: crosshair;
        }

        .move {
            cursor: move;
        }

        .text {
            cursor: text;
        }

        .wait {
            cursor: wait;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .help {
            cursor: help;
        }

        /* Nueva clase para el cursor personalizado */
        .custom {
            /* Se recomienda que la imagen sea de 32x32 píxeles para máxima compatibilidad */
            cursor: url('ilove.jpg'), pointer;
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">22 Cursors</h1>
            <h2>Specifies the mouse cursor to be displayed when pointing over an element.</h2>
        </header>
        <section>
            <!-- Nueva sección para el cursor personalizado -->
            <h3>custom (ilove.jpg):</h3>
            <div class="caja-cursor custom"></div>

            <h3>auto:</h3>
            <div class="caja-cursor auto"></div>

            <h3>pointer:</h3>
            <div class="caja-cursor pointer"></div>

            <h3>crosshair:</h3>
            <div class="caja-cursor crosshair"></div>

            <h3>move:</h3>
            <div class="caja-cursor move"></div>

            <h3>text:</h3>
            <div class="caja-cursor text"></div>

            <h3>wait:</h3>
            <div class="caja-cursor wait"></div>

            <h3>not-allowed:</h3>
            <div class="caja-cursor not-allowed"></div>

            <h3>help:</h3>
            <div class="caja-cursor help"></div>
        </section>
    </main>
</body>

</html>
