<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-alpha_colors</title>
    <link rel="stylesheet" href="../03-css/css/12-alpha_colors.css">
    <style>
        figure.narita{
            all: revert;
            background: url(../src/imgs/narita.png) no-repeat center / cover;
            border: 4px solid #fff;
            margin-block: 4rem;
            height: 380px;
            width: 380px;
            div{
                all: revert;
                height: calc(380px/3);
                &.box1{
                    background-color: rgba(128,0,128,0.8);
                }
                &.box2{
                    background-color: #800077c1;
                }
                &.box3{
                    background-color: hsl(300,100%,25%, 0.267);
                }
            }
        }
    </style>
</head>

<body>
    <a href="/03-css/index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M184,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h56a8,8,0,0,0,8-8V80A8,8,0,0,0,184,72Zm-8,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h56Zm48-88v96a8,8,0,0,1-16,0V80a8,8,0,0,1,16,0Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 id="h1_1">12-Colors alpha</h1>
            <h2>The fourth alpha channel allows you to apply opacity or transparency to the color.</h2>
        </header>
        <section>
            <h3>Example transparent Colors:</h3>
            <figure class="narita">
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
            </figure>
        </section>
    </main>
</body>
</html>
